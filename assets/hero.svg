<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Courier New',monospace">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d2338"/>
      <stop offset="55%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdf6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bdf6ff" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#bdf6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#nebula)"/>

  <g fill="#cfeeff">
    <circle cx="92"  cy="64"  r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="150" r="1.2"><animate attributeName="opacity" values="1;.2;1"   dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="52"  r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="112" r="1.1"><animate attributeName="opacity" values="1;.3;1"   dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="563" cy="38"  r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="704" cy="96"  r="1.3"><animate attributeName="opacity" values="1;.25;1"  dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="818" cy="60"  r="1.7"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="936" cy="128" r="1.2"><animate attributeName="opacity" values="1;.2;1"   dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1052" cy="48" r="1.6"><animate attributeName="opacity" values=".25;1;.25" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="104" r="1.2"><animate attributeName="opacity" values="1;.3;1"  dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="210" r="1.1"><animate attributeName="opacity" values=".3;1;.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="196" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="url(#gridfade)" stroke-width="1">
    <line x1="0"    y1="360" x2="420"  y2="252"/>
    <line x1="240"  y1="360" x2="510"  y2="252"/>
    <line x1="480"  y1="360" x2="580"  y2="252"/>
    <line x1="720"  y1="360" x2="660"  y2="252"/>
    <line x1="960"  y1="360" x2="720"  y2="252"/>
    <line x1="1200" y1="360" x2="780"  y2="252"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="272" x2="1200" y2="272"/>
    <line x1="0" y1="298" x2="1200" y2="298"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
  </g>

  <g stroke="#00e5ff" stroke-width="2" opacity=".85" fill="none">
    <path d="M 24 54 V 26 H 60"/>
    <path d="M 1140 26 H 1176 V 54"/>
    <path d="M 24 306 V 334 H 60"/>
    <path d="M 1140 334 H 1176 V 306"/>
  </g>

  <g filter="url(#glow)">
    <text x="600" y="168" text-anchor="middle" font-size="72" font-weight="bold" fill="#eaf6ff" letter-spacing="14">公子小白</text>
  </g>
  <text x="600" y="212" text-anchor="middle" font-size="15" fill="#00e5ff" letter-spacing="8" filter="url(#glowS)">GONGZI XIAOBAI · GITHUB PROFILE</text>

  <g font-size="14" fill="#8fd8ee">
    <text x="600" y="248" text-anchor="middle">[ SYSTEM ONLINE ] <tspan fill="#00e5ff">●</tspan>  ICE PROTOCOL <tspan fill="#ff2bd6">v2.0</tspan></text>
  </g>
  <rect x="936" y="238" width="9" height="13" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
    <animate attributeName="y" values="-80;360" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
