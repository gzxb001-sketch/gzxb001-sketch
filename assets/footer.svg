<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" font-family="'Courier New',monospace">
  <defs>
    <radialGradient id="fneb" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#0a1c31"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="150" fill="url(#fneb)"/>
  <rect x="0" y="0" width="1200" height="1.5" fill="#00e5ff" opacity=".6"/>

  <g stroke="#00e5ff" stroke-width="1" opacity=".22">
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="300" y1="100" x2="240" y2="150"/>
    <line x1="600" y1="100" x2="600" y2="150"/>
    <line x1="900" y1="100" x2="960" y2="150"/>
  </g>

  <text x="600" y="72" text-anchor="middle" font-size="21" letter-spacing="5" fill="#00e5ff" filter="url(#fglow)">TRANSMISSION END · 传输完毕<tspan fill="#ff2bd6">▮<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  <text x="600" y="100" text-anchor="middle" font-size="12" letter-spacing="3" fill="#5b87a6">ICE PROTOCOL · PROFILE OF GONGZI XIAOBAI</text>
</svg>
